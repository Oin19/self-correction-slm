name: import approved baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import selected baseline from proposal repository
        run: |
          git clone --depth 1 https://github.com/Oin19/self-correction-llm.git /tmp/proposal
          rsync -a             --exclude='.git/'             --exclude='README.md'             --exclude='.gitignore'             --exclude='scratch/'             --exclude='results/'             --exclude='output*.md'             --exclude='docs/experiment_status.md'             --exclude='docs/experiments.md'             --exclude='docs/screenshots/'             --exclude='notebooks/*_corrected.ipynb'             /tmp/proposal/ ./

          git add src notebooks tests configs data checkpoints docs requirements.txt conftest.py
          if git diff --cached --quiet; then
            echo "No baseline files to import."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: import approved implementation baseline"
          git push
