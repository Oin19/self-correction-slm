# Phase 1 Gate G0: Shared Experimental Protocol Freeze
# Frozen across Rajdeep (RL & Training) and Aihik (Data, Execution & Evaluation)

protocol_version: "1.0.0"
gate: "G0"
date_frozen: "2026-10-22"

models:
  primary: "deepseek-ai/deepseek-coder-1.3b-instruct"
  secondary: "Qwen/Qwen2.5-Coder-1.5B-Instruct"

turn_budgets:
  k_values: [1, 3, 5]
  default_k: 3

seeds:
  primary: 42
  replication: [42, 43, 44]

benchmarks:
  apps:
    hf_dataset: "codeparrot/apps"
    train_split: "train[:1500]"
    held_out_eval_split: "train[1500:2000]"
  humaneval:
    hf_dataset: "openai_humaneval"
    split: "test"
    total_problems: 164
    problem_id_format: "HumanEval/{0..163}"
  mbpp:
    hf_dataset: "google-research-datasets/mbpp"
    split: "test"

feedback_modes:
  F0:
    name: "no_feedback"
    description: "Pure repeated-sampling control (B1), no feedback prompt injection"
  F1:
    name: "status_only"
    description: "Execution status indicator only (AC, WA, TLE, MLE, CE, RE)"
  F2:
    name: "sanitized_traceback"
    description: "Sanitized runtime exception and traceback with all expected/oracle outputs redacted"
  F3:
    name: "structured_summary"
    description: "Structured breakdown of passed vs total test counts and error categories"

prompt_templates:
  initial: |
    ### Problem:
    {problem}

    ### Solution:
    ```python
  repair: |
    ### Problem:
    {problem}

    ### Previous Solution:
    ```python
    {prev_code}
    ```

    ### Execution Feedback:
    {feedback}

    ### Fixed Solution:
    ```python
